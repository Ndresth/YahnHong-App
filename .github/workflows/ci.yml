name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Servidor - instalar
        working-directory: server
        run: npm ci
      - name: Servidor - pruebas
        working-directory: server
        run: npm test

      - name: Cliente - instalar
        working-directory: client
        run: npm ci
      - name: Cliente - lint
        working-directory: client
        run: npx eslint .
      - name: Cliente - build
        working-directory: client
        run: npm run build
